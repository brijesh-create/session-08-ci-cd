# CI pipeline for the HealthTechGov BMI Checker
# Runs every time code is pushed to the main branch.
# CI = Continuous Integration: automatically test and build every change.

name: CI Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab

permissions:
  contents: read

jobs:
  # ---------- CI: check the code and build it ----------
  ci:
    name: CI - Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: 1. Get the code
        uses: actions/checkout@v4

      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Run tests
        run: npm test

      - name: 4. Build the website
        run: npm run build

      - name: 5. Save the build (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: dist
