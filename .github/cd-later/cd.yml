# CD pipeline for the HealthTechGov BMI Checker (NOT ACTIVE YET)
# CD = Continuous Deployment: automatically put a tested build live.
#
# GitHub only runs workflows inside .github/workflows/, so this file does
# nothing while it sits in .github/cd-later/.
#
# To turn it on later:
#   1. Settings -> Pages -> Build and deployment -> Source -> "GitHub Actions"
#   2. Move this file to .github/workflows/cd.yml, then commit and push.
#
# It is a full workflow: it tests and builds again, then deploys only if that passed.

name: CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Test and Build for deploy
    runs-on: ubuntu-latest
    steps:
      - name: 1. Get the code
        uses: actions/checkout@v4

      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Run tests
        run: npm test

      - name: 4. Build the website
        run: npm run build

      - name: 5. Save the build for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ---------- CD: put the build live ----------
  cd:
    name: CD - Deploy to GitHub Pages
    needs: build              # runs ONLY if the tests and build passed
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 6. Deploy the website
        id: deployment
        uses: actions/deploy-pages@v4
